<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Vandal Demo App</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding-top: 50px; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; }
        #message { margin-top: 20px; font-weight: bold; color: green; }
    </style>
</head>
<body>
    <h1>Vandal Demo App</h1>
    <button id="login-btn" onclick="document.getElementById('message').innerText = 'Logged In Successfully!'">Login</button>
    
    <div id="shadow-host"></div>
    
    <div id="message"></div>

    <script>
        const host = document.getElementById('shadow-host');
        const root = host.attachShadow({mode: 'open'});
        root.innerHTML = `
            <style>
                button { padding: 10px 20px; font-size: 16px; cursor: pointer; background: #28a745; color: white; border: none; border-radius: 4px; margin-top: 10px; }
            </style>
            <button id="shadow-btn">Shadow Button</button>
        `;
    </script>
</body>
</html>
