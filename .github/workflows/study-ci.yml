name: Study harness
on:
  pull_request:
    paths: ['study/**', '.dockerignore', '.github/workflows/study-ci.yml', 'pyproject.toml']
  push:
    branches: [main]
    paths: ['study/**', '.dockerignore', '.github/workflows/study-ci.yml', 'pyproject.toml']
permissions:
  contents: read
jobs:
  owned-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]' build
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest study/tests -q
      - run: python -m study.fixture_smoke --results study/results/ci-fixture
      - run: python -m study.summarize --results study/results/ci-fixture --report study/CI_REPORT.md
      - run: python -m build --wheel
      - name: Verify wheel excludes study
        run: python -c "import pathlib, zipfile; w=next(pathlib.Path('dist').glob('*.whl')); names=zipfile.ZipFile(w).namelist(); assert not any(n.startswith('study/') for n in names); print(w, names)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owned-study-fixture
          path: |
            study/results/ci-fixture
            study/CI_REPORT.md
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build owned image
        run: |
          docker build --pull -f study/Dockerfile -t vandal-study:ci --iidfile image-id.txt .
          mkdir -p fixture-wheels
      - name: Exercise local tar, worker, export and cleanup offline
        run: python -m study.run_study --owned-fixture --image "$(cat image-id.txt)" --wheelhouse fixture-wheels --results study/results/ci-container --seconds 600
      - name: Verify isolation and scored raw report
        run: python -m study.verify_container study/results/ci-container
      - name: Summarize actual fixture result
        if: always()
        run: python -m study.summarize --results study/results/ci-container --report study/CI_CONTAINER_REPORT.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owned-study-container
          path: |
            study/results/ci-container
            study/CI_CONTAINER_REPORT.md
            image-id.txt
