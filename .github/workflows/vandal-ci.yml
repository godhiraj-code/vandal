name: Project Vandal CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip wheel --no-deps . --wheel-dir dist
        python -c "from pathlib import Path; import subprocess, sys; subprocess.check_call([sys.executable, '-m', 'pip', 'install', str(next(Path('dist').glob('*.whl'))) + '[test,mcp]'])"
        
    - name: Install Playwright Browsers
      run: playwright install --with-deps chromium
      
    - name: Verify Package Import
      run: |
        python -c "import vandal; print('Vandal Package imported successfully')"
        
    - name: Run Demo (Headless)
      run: |
        python demo_vandal.py --headless

    - name: Run plugin and browser regression tests (Headless)
      run: |
        mkdir -p "$RUNNER_TEMP/vandal-wheel-check"
        cp -R tests docs examples "$RUNNER_TEMP/vandal-wheel-check/"
        cd "$RUNNER_TEMP/vandal-wheel-check"
        python -c "import vandal; print('Testing installed wheel:', vandal.__file__)"
        python -m pytest tests -q

    - name: Compare weak and strong example tests
      run: |
        cd "$RUNNER_TEMP/vandal-wheel-check"
        python -m pytest examples/test_strength.py --vandal --vandal-strategies=logic_sabotage --vandal-min-score=50
