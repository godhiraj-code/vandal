name: Protocol suite scoring
# Scores ONE committed agent-written suite (study/protocol/suites/<agent>/<app>/tests_agent)
# against its pinned app: 10 baseline runs for flakiness, then Vandal mutation only if all
# runs are green. Manual dispatch only; uses the reviewer-gated study-pilot environment.
# No agent credential is used or needed here.
on:
  workflow_dispatch:
    inputs:
      agent:
        description: Agent folder under study/protocol/suites (for example codex)
        required: true
        type: string
      app:
        description: App name from study/protocol/apps.csv
        required: true
        type: choice
        options: [platelet, contrail, todomvc]
      confirm:
        description: Exact RUN token from python -m study.protocol_run print-confirm
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: protocol-score
  cancel-in-progress: false
jobs:
  score:
    runs-on: ubuntu-24.04
    environment: study-pilot
    permissions:
      contents: read
    timeout-minutes: 60
    steps:
      - name: Require configured environment reviewer gate
        env:
          GATE: ${{ vars.STUDY_PILOT_GATE }}
        run: |
          if [ "$GATE" != "reviewer-configured" ]; then
            echo "Protocol scoring blocked: the study-pilot environment reviewer gate is not configured."
            exit 1
          fi
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        id: checkout
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Validate exact confirmation, approved app and committed suite
        env:
          AGENT: ${{ inputs.agent }}
          APP: ${{ inputs.app }}
          CONFIRM: ${{ inputs.confirm }}
        run: env -i PATH="$PATH" python -m study.protocol_run preflight --agent "$AGENT" --app "$APP" --confirm "$CONFIRM"
      - name: Build owned image and record immutable ID
        run: |
          mkdir -p "$RUNNER_TEMP/study-home" "$RUNNER_TEMP/study-docker"
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/study-home" DOCKER_CONFIG="$RUNNER_TEMP/study-docker" \
            docker build --pull -f study/Dockerfile --iidfile study/protocol-image-id.txt .
          cat study/protocol-image-id.txt
      - name: Download reviewed binary wheelhouse without credentials
        run: bash study/wheelhouse/fetch.sh --dest wheelhouse
      - name: Score the suite inside an offline container
        env:
          AGENT: ${{ inputs.agent }}
          APP: ${{ inputs.app }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/study-home" DOCKER_CONFIG="$RUNNER_TEMP/study-docker" \
            python -m study.protocol_run run --agent "$AGENT" --app "$APP" --confirm "$CONFIRM" \
            --image "$(cat study/protocol-image-id.txt)" --wheelhouse wheelhouse \
            --results study/results/protocol
      - name: Job summary from recorded outcome
        if: always() && steps.checkout.outcome == 'success'
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          for status in sorted(pathlib.Path("study/results/protocol").glob("*/*/status.json")):
              s = json.loads(status.read_text())
              w = s.get("worker", {})
              flake = w.get("flake", {})
              score = None
              report = status.parent / "vandal_report.json"
              if report.exists():
                  score = json.loads(report.read_text()).get("summary", {}).get("score")
              print(f"### {status.parent.parent.name} / {status.parent.name}")
              print(f"- status: {s.get('status')} ({s.get('reason')})")
              print(f"- green baseline runs: {flake.get('green_runs')} of {flake.get('requested_runs')}; flaky tests: {flake.get('n_flaky')} of {flake.get('n_tests')}")
              print(f"- mutation score: {score if score is not None else 'N/A'}")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && steps.checkout.outcome == 'success'
        with:
          name: protocol-score-${{ inputs.agent }}-${{ inputs.app }}-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            study/results/protocol/**
            wheelhouse/MANIFEST.csv
            study/protocol-image-id.txt
