[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "project-vandal"
version = "0.2.1"
authors = [
  { name="Dhiraj Das", email="dhirajdas.666@gmail.com" },
]
description = "Mutation testing for Playwright UI tests: sabotage the DOM and find out whether your end-to-end suite actually notices."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "playwright",
    "playwright-python",
    "mutation-testing",
    "ui-testing",
    "e2e-testing",
    "end-to-end-testing",
    "test-quality",
    "pytest",
    "dom",
    "shadow-dom",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: AsyncIO",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Testing :: Acceptance",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "playwright>=1.60.0",
    "pytest>=7.0",
    "psutil>=5.9",
]

[project.entry-points.pytest11]
vandal = "vandal.pytest_plugin"

[project.scripts]
vandal-mcp = "vandal.mcp_server:main"

[project.optional-dependencies]
mcp = ["mcp>=1.0,<2; python_version >= '3.10'"]
test = ["pytest-playwright>=0.5", "pytest-asyncio>=0.23", "jsonschema>=4"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.urls]
Homepage = "https://www.dhirajdas.dev/project/project-vandal"
Documentation = "https://github.com/godhiraj-code/vandal/blob/main/TESTER_GUIDE.md"
Repository = "https://github.com/godhiraj-code/vandal"
Issues = "https://github.com/godhiraj-code/vandal/issues"
Blog = "https://www.dhirajdas.dev/blog/project-vandal-ui-mutation-testing"
X = "https://x.com/dkkkkd"

[tool.setuptools]
packages = ["vandal"]
package-dir = {"vandal" = "."}
